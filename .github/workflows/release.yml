name: release-gate
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Ubuntu 26.04 / minimum Node 24.8.0", os: ubuntu-26.04, node: 24.8.0 }
          - { name: "Ubuntu 26.04 / current Node 24", os: ubuntu-26.04, node: 24 }
          - { name: "macOS / current Node 24", os: macos-latest, node: 24 }
          - { name: "Windows / current Node 24", os: windows-latest, node: 24 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: agents
      - name: Read source dependency revisions
        id: revisions
        shell: bash
        working-directory: agents
        run: node -e "const fs = require('node:fs'); const packageManifest = require('./package.json'); fs.appendFileSync(process.env.GITHUB_OUTPUT, 'agent-core=' + packageManifest.agentCore.commit + '\\n')"
      - uses: actions/checkout@v4
        with:
          repository: Ismail-elkorchi/agent-core
          ref: ${{ steps.revisions.outputs.agent-core }}
          path: agent-core
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            agents/package-lock.json
            agent-core/package-lock.json
      - name: Build Agent Core
        working-directory: agent-core
        run: npm ci && npm run build
      - name: Install ripgrep
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Verify agents
        working-directory: agents
        run: npm ci && npm run verify:release
