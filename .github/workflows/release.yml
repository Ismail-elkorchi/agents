name: release-gate
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Ubuntu / minimum Node 24.8.0", os: ubuntu-latest, node: 24.8.0 }
          - { name: "Ubuntu / current Node 24", os: ubuntu-latest, node: 24 }
          - { name: "macOS / current Node 24", os: macos-latest, node: 24 }
          - { name: "Windows / current Node 24", os: windows-latest, node: 24 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: agents
          fetch-depth: 0
      - name: Read reviewed dependency revisions
        id: revisions
        shell: bash
        working-directory: agents
        run: node -e "const fs = require('node:fs'); const manifest = require('./.coding-agent-plan/manifest.json'); fs.appendFileSync(process.env.GITHUB_OUTPUT, 'agent-core=' + manifest.reviewedHeads['agent-core'] + '\\nterminal-ui=' + manifest.reviewedHeads['terminal-ui'] + '\\nsandbox=' + manifest.reviewedHeads.sandbox + '\\n')"
      - uses: actions/checkout@v4
        with:
          repository: Ismail-elkorchi/agent-core
          ref: ${{ steps.revisions.outputs.agent-core }}
          path: agent-core
      - uses: actions/checkout@v4
        with:
          repository: Ismail-elkorchi/terminal-ui
          ref: ${{ steps.revisions.outputs.terminal-ui }}
          path: terminal-ui
      - uses: actions/checkout@v4
        with:
          repository: Ismail-elkorchi/sandbox
          ref: ${{ steps.revisions.outputs.sandbox }}
          path: sandbox
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            agents/package-lock.json
            agent-core/package-lock.json
      - name: Build Agent Core
        working-directory: agent-core
        run: npm ci && npm run build
      - name: Verify agents
        working-directory: agents
        run: npm ci && npm run verify:release
