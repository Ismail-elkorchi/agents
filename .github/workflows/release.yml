name: release-gate
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Ubuntu 24.04 / minimum Node 24.8.0", os: ubuntu-24.04, node: 24.8.0 }
          - { name: "Ubuntu 24.04 / current Node 24", os: ubuntu-24.04, node: 24 }
          - { name: "macOS / current Node 24", os: macos-latest, node: 24 }
          - { name: "Windows / current Node 24", os: windows-latest, node: 24 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: agents
      - name: Read source dependency revisions
        id: revisions
        shell: bash
        working-directory: agents
        run: node -e "const fs = require('node:fs'); const packageManifest = require('./package.json'); fs.appendFileSync(process.env.GITHUB_OUTPUT, 'agent-core=' + packageManifest.agentCore.commit + '\\nsandbox=' + packageManifest.sandbox.commit + '\\n')"
      - uses: actions/checkout@v4
        with:
          repository: Ismail-elkorchi/agent-core
          ref: ${{ steps.revisions.outputs.agent-core }}
          path: agent-core
      - uses: actions/checkout@v4
        with:
          repository: Ismail-elkorchi/sandbox
          ref: ${{ steps.revisions.outputs.sandbox }}
          path: sandbox
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            agents/package-lock.json
            agent-core/package-lock.json
            sandbox/package-lock.json
      - name: Build Agent Core
        working-directory: agent-core
        run: npm ci && npm run build
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Install Linux native target
        if: runner.os == 'Linux'
        run: rustup target add x86_64-unknown-linux-musl
      - name: Build Sandbox package
        working-directory: sandbox
        run: npm ci && npm run build
      - name: Enable native namespace conformance
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Verify agents
        working-directory: agents
        env:
          CODING_AGENT_REQUIRE_NATIVE_CONFORMANCE: ${{ runner.os == 'Linux' && '1' || '0' }}
        run: npm ci && npm run verify:release
